# docp stack: nginx (UI + /api proxy) | backend | ollama (internal only)
#
# Deploy: point TLS reverse proxy (Caddy, Traefik, cloud LB) at port 80.
#   https://your-domain/       → static UI
#   https://your-domain/api/   → backend (Ollama only reachable inside this network)
#   https://your-domain/document/ → Docusaurus user guide (static files in web/nginx image)
#
# Ollama models: persisted in volume `ollama-data`, pulled at start from OLLAMA_MODELS (comma-separated).
# Add models: extend OLLAMA_MODELS in .env and recreate ollama, or docker exec ollama ollama pull <name>
# Then: docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - docp-internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docp}
      POSTGRES_DB: ${POSTGRES_DB:-docp}
    volumes:
      - /home/ubuntu/postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    networks:
      - docp-internal
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER_AI:-customer_app}:${POSTGRES_PASSWORD_AI}@postgres:5432/${POSTGRES_DB:-docp}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      HF_INFERENCE_URL: ${HF_INFERENCE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      DATABASE_URL_ADMIN: postgresql://${POSTGRES_USER:-docp}:${POSTGRES_PASSWORD:-docp}@postgres:5432/${POSTGRES_DB:-docp}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      FILE_STORAGE_ROOT: /data/files
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-ollama}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      OLLAMA_STRUCTURE_MODEL: ${OLLAMA_STRUCTURE_MODEL:-qwen2.5:3b}
      OLLAMA_STRUCTURE_NUM_CTX: ${OLLAMA_STRUCTURE_NUM_CTX:-32768}
      OLLAMA_STRUCTURE_NUM_PREDICT: ${OLLAMA_STRUCTURE_NUM_PREDICT:-8192}
      OLLAMA_STRUCTURE_TEMPERATURE: ${OLLAMA_STRUCTURE_TEMPERATURE:-0}
      OLLAMA_STRUCTURE_FORMAT: ${OLLAMA_STRUCTURE_FORMAT:-}
      OLLAMA_FETCH_TIMEOUT_MS: ${OLLAMA_FETCH_TIMEOUT_MS:-900000}
      PDF_PAGE_MIN_TEXT_CHARS: ${PDF_PAGE_MIN_TEXT_CHARS:-50}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-}
      STRUCTURE_MAX_CHARS: ${STRUCTURE_MAX_CHARS:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL_SEC: ${AUTH_ACCESS_TOKEN_TTL_SEC:-900}
      AUTH_REFRESH_TOKEN_TTL_SEC: ${AUTH_REFRESH_TOKEN_TTL_SEC:-604800}
      AUTH_TOKEN_TTL_SEC: ${AUTH_TOKEN_TTL_SEC:-604800}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      OPENAI_STRUCTURE_MODEL: ${OPENAI_STRUCTURE_MODEL:-gpt-4o-mini}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_VISION_MODEL: ${BEDROCK_VISION_MODEL:-}
      BEDROCK_STRUCTURE_MODEL: ${BEDROCK_STRUCTURE_MODEL:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      S3_AWS_BUCKET: ${S3_AWS_BUCKET:-}
      S3_AWS_REGION: ${S3_AWS_REGION:-}
      S3_AWS_ACCESS_KEY_ID: ${S3_AWS_ACCESS_KEY_ID:-}
      S3_AWS_SECRET_ACCESS_KEY: ${S3_AWS_SECRET_ACCESS_KEY:-}
      HUGGINGFACE_VISION_MODEL: ${HUGGINGFACE_VISION_MODEL:-}
      HUGGINGFACE_STRUCTURE_MODEL: ${HUGGINGFACE_STRUCTURE_MODEL:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_BASE_URL: ${HUGGINGFACE_BASE_URL:-}
    volumes: 
      - "${FILES_HOST_PATH:-/home/ubuntu/docp/files}:/data/files"
    depends_on:
      postgres:
        condition: service_healthy

  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    networks:
      - docp-internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docp}:${POSTGRES_PASSWORD:-docp}@postgres:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:-}
      FORCE_SSL: ${DOCUSEAL_FORCE_SSL:-false}
      HOST: ${DOCUSEAL_HOST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TYPE: ${SMTP_TYPE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_ACCESS_KEY_ID: ${DOCUSEAL_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      AWS_SECRET_ACCESS_KEY: ${DOCUSEAL_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      SMTP_ADDRESS: ${SMTP_HOST:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - "${DOCUSEAL_DATA_HOST_PATH:-/home/ubuntu/docuseal-data}:/data/docuseal"
    ports:
      - "${DOCUSEAL_PUBLISH_PORT:-3030}:3000"        

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${DOC_PUBLISH_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - docp-internal
    depends_on:
      - backend

networks:
  docp-internal:
    driver: bridge

volumes:
  postgres-data:
 