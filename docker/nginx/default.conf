include /etc/nginx/mime.types;

types {
    application/javascript js mjs;
}

# Gzip compression — reduces JS/CSS transfer by ~70% (e.g. 1.7 MB → 436 kB).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# Docker's embedded DNS. Required so the variable-based proxy_pass below re-resolves
# `backend` at request time instead of caching the IP at config-load time — otherwise
# a backend restart with a new container IP strands nginx on the dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Friendly page when the backend container is unreachable (502/503/504).
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        try_files /50x.html @50x_inline;
    }
    location @50x_inline {
        default_type text/html;
        return 502 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Starting</title><style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc}div{text-align:center;max-width:420px;padding:2rem}h1{font-size:1.5rem;color:#1e293b;margin-bottom:.5rem}p{color:#64748b;margin-bottom:1.5rem}button{background:#3b82f6;color:#fff;border:none;padding:.6rem 1.4rem;border-radius:.5rem;cursor:pointer;font-size:1rem}button:hover{background:#2563eb}</style></head><body><div><h1>Service is Starting</h1><p>The backend is not reachable yet. It may be starting up or restarting. Please wait a moment and try again.</p><button onclick="location.reload()">Retry</button></div></body></html>';
    }

    # Hashed assets — cache 1 year (Vite content-hashes the filenames).
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ES module workers (e.g. pdf.js) must not fall through to index.html.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location /api/ {
        set $upstream "backend:3000";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 900s;
        # API clients get JSON, not the HTML error page.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"statusCode":503,"message":"Service temporarily unavailable. The backend is starting up."}';
    }

    location /health {
        set $upstream "backend:3000";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @health_down;
    }
    location @health_down {
        default_type application/json;
        return 503 '{"status":"down","reason":"backend unreachable"}';
    }

    # Socket.IO (Nest /notifications namespace) — required for live in-app bell updates.
    # proxy_connect_timeout must be explicit; this block doesn't inherit the /api/ value.
    location /socket.io/ {
        set $upstream "backend:3000";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Docusaurus user guide (built in web image at build time — no backend proxy)
    location /document/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /document/index.html;
    }

    location = /document {
        return 301 /document/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
